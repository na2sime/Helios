plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'fr.nassime.helios'
version = '2.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Core dependencies
    implementation 'org.jetbrains:annotations:24.1.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // Lombok for code generation
    compileOnly "org.projectlombok:lombok:1.18.28"
    annotationProcessor "org.projectlombok:lombok:1.18.28"

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.6.0'
}

test {
    useJUnitPlatform()
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    exclude '**/HeliosBuilder.java'
}

// Alternative: skip javadoc errors completely
tasks.withType(Javadoc) {
    failOnError = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'helios-api'

            pom {
                name = 'Helios ORM API'
                description = 'Core API for Helios ORM - Multi-database Object-Relational Mapper'
                url = 'https://github.com/na2sime/helios'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'na2sime'
                        name = 'Nassime'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/na2sime/helios.git'
                    developerConnection = 'scm:git:ssh://github.com/na2sime/helios.git'
                    url = 'https://github.com/na2sime/helios'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/na2sime/helios")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}