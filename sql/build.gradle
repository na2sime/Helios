plugins {
    id 'java'
    id 'maven-publish'
}

group = 'fr.nassime.helios'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Compile dependency on api module
    api project(':api')
    
    // HikariCP for connection pooling
    implementation 'com.zaxxer:HikariCP:5.0.1'
    
    // Lombok for generating boilerplate code
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    
    // Logging
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    
    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.6.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.6.0'
    testCompileOnly 'org.projectlombok:lombok:1.18.28'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.28'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'helios-sql'

            pom {
                name = 'Helios ORM SQL'
                description = 'Common SQL functionality for Helios ORM'
                url = 'https://github.com/na2sime/helios'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'na2sime'
                        name = 'Nassime'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/na2sime/helios.git'
                    developerConnection = 'scm:git:ssh://github.com/na2sime/helios.git'
                    url = 'https://github.com/na2sime/helios'
                }
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/na2sime/helios")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}